<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>UEB · Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #e2e8f0; }
  .header { background: linear-gradient(90deg, #1d4ed8, #0ea5e9); padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 24px rgba(14,165,233,.35); }
  .header-icon { font-size: 28px; }
  .header-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: .03em; }
  .header-sub { font-size: 11px; color: #bae6fd; letter-spacing: .1em; text-transform: uppercase; }
  .container { padding: 20px; max-width: 680px; margin: 0 auto; }
  .card { background: #1e293b; border: 1.5px solid #334155; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .card-title { font-size: 12px; color: #64748b; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 14px; }
  .login-form input { width: 100%; padding: 11px 14px; border-radius: 10px; border: 1.5px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; outline: none; margin-bottom: 10px; font-family: inherit; }
  .login-form input:focus { border-color: #0ea5e9; }
  .login-form button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #1d4ed8; color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; font-family: inherit; }
  .login-form button:hover { background: #2563eb; }
  .err { color: #f87171; font-size: 12px; margin-top: 8px; text-align: center; }
  .stat-big { font-size: 48px; font-weight: 900; color: #0ea5e9; line-height: 1; }
  .stat-label { font-size: 11px; color: #64748b; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #0f172a; }
  .bar-date { font-size: 12px; color: #94a3b8; min-width: 90px; }
  .bar-track { flex: 1; height: 18px; background: #0f172a; border-radius: 4px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #1d4ed8, #0ea5e9); border-radius: 4px; transition: width .4s; }
  .bar-count { font-size: 12px; font-weight: 700; color: #e2e8f0; min-width: 40px; text-align: right; }
  .logout { background: transparent; border: none; color: #64748b; font-size: 12px; cursor: pointer; font-family: inherit; text-decoration: underline; }
  .loading { color: #475569; font-size: 13px; text-align: center; padding: 20px; }
  .meta { font-size: 11px; color: #475569; margin-top: 16px; line-height: 1.6; }
</style>
</head>
<body>
<div class="header">
  <span class="header-icon">🔐</span>
  <div style="flex:1">
    <div class="header-title">UEB · Admin</div>
    <div class="header-sub">Estadístiques de visites</div>
  </div>
</div>
<div class="container" id="root"></div>
<script>
(function(){
  const WS = 'wts-ueb-2025-priv-x7k9q';
  const SALT = 'ueb-salt-2026:';
  const HASH_OK = '215268137b5619c29bcb96dddd746c14464913078ac19f61a83dc37306581740';
  const USERNAME = 'asanchez';
  const SESSION_KEY = 'uebAdminAuth';

  async function sha256(s) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function isAuth() {
    return sessionStorage.getItem(SESSION_KEY) === HASH_OK;
  }

  function loginView() {
    document.getElementById('root').innerHTML = `
      <div class="card">
        <div class="card-title">Iniciar sessió</div>
        <form class="login-form" id="loginForm">
          <input type="text" id="user" placeholder="Usuari" autocomplete="username" required>
          <input type="password" id="pass" placeholder="Contrasenya" autocomplete="current-password" required>
          <button type="submit">Entrar</button>
          <div class="err" id="err" style="display:none">Credencials incorrectes</div>
        </form>
      </div>
    `;
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('user').value.trim();
      const p = document.getElementById('pass').value;
      const h = await sha256(SALT + p);
      if (u === USERNAME && h === HASH_OK) {
        sessionStorage.setItem(SESSION_KEY, HASH_OK);
        dashboardView();
      } else {
        document.getElementById('err').style.display = 'block';
      }
    });
  }

  function lastNDays(n) {
    const out = [];
    const d = new Date();
    for (let i = 0; i < n; i++) {
      out.push(d.toISOString().slice(0, 10));
      d.setDate(d.getDate() - 1);
    }
    return out;
  }

  async function fetchCounter(key) {
    try {
      const r = await fetch(`https://api.counterapi.dev/v1/${WS}/${key}/info`);
      if (!r.ok) return 0;
      const data = await r.json();
      return data.count || 0;
    } catch { return 0; }
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    const dies = ['Dg', 'Dl', 'Dm', 'Dc', 'Dj', 'Dv', 'Ds'];
    return `${dies[d.getDay()]} ${d.getDate()}/${d.getMonth() + 1}`;
  }

  async function dashboardView() {
    document.getElementById('root').innerHTML = `
      <div class="card">
        <div class="card-title">Total visites úniques</div>
        <div class="stat-big" id="total">···</div>
        <div class="meta">Es compta 1 visita per sessió de navegador (sessionStorage). Si un usuari recarrega la mateixa pestanya, no es duplica.</div>
      </div>
      <div class="card">
        <div class="card-title">Avui vs ahir vs setmana</div>
        <div class="grid-2">
          <div>
            <div class="stat-label">Avui</div>
            <div class="stat-big" id="today" style="font-size:32px">···</div>
          </div>
          <div>
            <div class="stat-label">Ahir</div>
            <div class="stat-big" id="yest" style="font-size:32px">···</div>
          </div>
        </div>
        <div style="margin-top:14px">
          <div class="stat-label">Últims 7 dies</div>
          <div class="stat-big" id="week7" style="font-size:32px">···</div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Últims 14 dies</div>
        <div id="daily" class="loading">Carregant...</div>
      </div>
      <div style="text-align:center; margin-top:8px">
        <button class="logout" id="logout">Tancar sessió</button>
      </div>
    `;

    document.getElementById('logout').addEventListener('click', () => {
      sessionStorage.removeItem(SESSION_KEY);
      loginView();
    });

    const total = await fetchCounter('total');
    document.getElementById('total').textContent = total.toLocaleString('ca-ES');

    const days = lastNDays(14);
    const counts = await Promise.all(days.map(d => fetchCounter(`day_${d.replace(/-/g, '')}`)));
    const todayCount = counts[0];
    const yestCount = counts[1];
    const week7 = counts.slice(0, 7).reduce((a, b) => a + b, 0);

    document.getElementById('today').textContent = todayCount.toLocaleString('ca-ES');
    document.getElementById('yest').textContent = yestCount.toLocaleString('ca-ES');
    document.getElementById('week7').textContent = week7.toLocaleString('ca-ES');

    const maxCount = Math.max(...counts, 1);
    const dailyHTML = days.map((d, i) => {
      const c = counts[i];
      const pct = (c / maxCount) * 100;
      return `
        <div class="bar-row">
          <div class="bar-date">${fmtDate(d)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-count">${c}</div>
        </div>
      `;
    }).join('');
    document.getElementById('daily').className = '';
    document.getElementById('daily').innerHTML = dailyHTML;
  }

  if (isAuth()) {
    dashboardView();
  } else {
    loginView();
  }
})();
</script>
</body>
</html>
