  // ─── ICS GENERATION ───────────────────────────────────────────────────────
  function datesBetween(dowISO) {
    const dates = [];
    const start = new Date('2025-05-26');
    const end = new Date('2025-06-19');
    const d = new Date(start);
    const jsDow = dowISO === 7 ? 0 : dowISO;
    while (d.getDay() !== (jsDow % 7 === 0 ? 0 : jsDow)) d.setDate(d.getDate() + 1);
    while (d <= end) {
      dates.push(new Date(d));
      d.setDate(d.getDate() + 7);
    }
    return dates;
  }

  function fmtDT(date, hhmm) {
    const [h, m] = hhmm.split(':').map(Number);
    const dt = new Date(date);
    dt.setHours(h, m, 0);
    const pad = n => String(n).padStart(2, '0');
    return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(h)}${pad(m)}00`;
  }

  function generarICS(equip) {
    const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//UE Barberà//Horaris//CA', 'CALSCALE:GREGORIAN'];
    equip.sessions.forEach(ses => {
      const dowISO = DIA_NUM[ses.dia];
      const dates = datesBetween(dowISO);
      dates.forEach(date => {
        const iso = date.toISOString().slice(0, 10);
        if (iso === '2025-06-06') return;
        if (equip.nom === 'Cadete A' && date.getDay() === 5 && date >= new Date('2025-06-01')) return;
        const uid = `${equip.nom.replace(/\s/g,'')}${iso}${ses.ini.replace(':','')}-${Math.random().toString(36).slice(2,8)}@uebarb`;
        lines.push('BEGIN:VEVENT');
        lines.push(`DTSTART:${fmtDT(date, ses.ini)}`);
        lines.push(`DTEND:${fmtDT(date, ses.fi)}`);
        lines.push(`SUMMARY:🏀 ${equip.nom}`);
        lines.push(`DESCRIPTION:Entrenament ${equip.nom}\\nEntrenador/a: ${equip.entrenadors || '—'}`);
        lines.push('LOCATION:UE Barberà');
        lines.push(`UID:${uid}`);
        lines.push('END:VEVENT');
      });
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  function downloadICS(equip) {
    const ics = generarICS(equip);
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${equip.nom.replace(/\s+/g,'_')}_UE_Barbera.ics`;
    a.click();
    URL.revokeObjectURL(url);
  }

    if (!e) return '#1d4ed8';
    if (isFem(e)) return '#db2777';
    if (e.nom.includes('Sènior') || e.nom.includes('Veteran')) return '#64748b';
    return '#1d4ed8';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function formatTel(tel) {
    return tel.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
  }

  // ─── RENDER ───────────────────────────────────────────────────────────────
  function render() {
    const equips = state.tab === 'masc' ? EQUIPS_MASC : state.tab === 'fem' ? EQUIPS_FEM : [];
    const filtered = state.busqueda.trim()
      ? allEquips.filter(e =>
          e.nom.toLowerCase().includes(state.busqueda.toLowerCase()) ||
          (e.entrenadors || '').toLowerCase().includes(state.busqueda.toLowerCase()) ||
          (e.jugadors || []).some(j => j.toLowerCase().includes(state.busqueda.toLowerCase()))
        )
      : equips;
    const detall = state.seleccionat && allEquips.find(e => e.nom === state.seleccionat);

    const headerHTML = `
      <div class="header">
        <span class="header-icon">🏀</span>
        <div style="flex:1">
          <div class="header-title">UE BARBERÀ</div>
          <div class="header-sub">Posttemporada 25-26 · 26 Maig → 19 Juny</div>
        </div>
        <div class="header-warn">⚠️ Dv 5 Juny = FESTIU</div>
      </div>`;

    let bodyHTML = '';

    if (detall) {
      const accent = accentColor(detall);
      bodyHTML = `
        <button class="back-btn" data-back="1">← Tornar</button>
        <div class="detall-card" style="--accent:${accent}">
          <div class="detall-header">
            <div class="detall-name">${escapeHtml(detall.nom)}</div>
            ${detall.entrenadors && detall.entrenadors !== '—' ? `<div class="detall-entr">🧑‍🏫 ${escapeHtml(detall.entrenadors)}</div>` : ''}
          </div>
          <div class="detall-body">
            ${detall.nota ? `<div class="nota">⚠️ ${escapeHtml(detall.nota)}</div>` : ''}
            <div class="section-label">📅 Entrenaments</div>
            <div class="sessions-wrap">
              ${detall.sessions.map(s => `<span class="badge ${s.dia}">${DIES_SHORT[s.dia]} ${s.ini}–${s.fi}</span>`).join('')}
            </div>
            <button class="download-btn ${state.downloaded ? 'done' : ''}" data-download="${escapeHtml(detall.nom)}">
              ${state.downloaded ? '✅ Descarregat! Obre-ho amb Google Calendar / Apple Calendar' : '📅 Afegir al calendari (.ics)'}
            </button>
            <div class="download-hint">
              Compatible amb Google Calendar, Apple Calendar i Outlook.<br>
              Genera tots els entrenaments del 26 Maig al 19 Juny.
            </div>
            ${detall.jugadors && detall.jugadors.length > 0 ? `
              <div class="section-label">👥 Jugadors/es (${detall.jugadors.length})</div>
              <div class="jugadors">
                ${detall.jugadors.map((j, i) => `<div class="jugador"><span class="jugador-num">${i+1}.</span>${escapeHtml(j)}</div>`).join('')}
              </div>
            ` : `<div style="font-size:12px;color:#475569;text-align:center;padding:8px">Llista de jugadors/es pendent</div>`}
          </div>
        </div>`;
    } else {
      const tabsHTML = !state.busqueda.trim() ? `
        <div class="tabs">
          <button class="tab-btn masc ${state.tab==='masc' ? 'active' : ''}" data-tab="masc">👦 Masculí</button>
          <button class="tab-btn fem ${state.tab==='fem' ? 'active' : ''}" data-tab="fem">👧 Femení</button>
          <button class="tab-btn info ${state.tab==='info' ? 'active' : ''}" data-tab="info">📞 Contactes</button>
        </div>
      ` : '';

      let listHTML = '';
      if (state.tab === 'info' && !state.busqueda.trim()) {
        listHTML = `<div class="contactes">
          ${CONTACTES.map(c => `
            <div class="contacte">
              <div>
                <div class="contacte-nom">${escapeHtml(c.nom)}</div>
                <div class="contacte-rol">${escapeHtml(c.rol)}</div>
              </div>
              ${c.tel ? `<a class="contacte-tel" href="tel:${c.tel}">📱 ${formatTel(c.tel)}</a>` : '<span class="contacte-tel-empty">—</span>'}
            </div>
          `).join('')}
        </div>`;
      } else {
        if (filtered.length === 0) {
          listHTML = '<div class="empty">Cap resultat</div>';
        } else {
          listHTML = `<div class="equips-list">
            ${filtered.map(e => `
              <button class="equip-card" data-equip="${escapeHtml(e.nom)}" style="--accent:${accentColor(e)}">
                <div class="equip-dot"></div>
                <div class="equip-info">
                  <div class="equip-name">${escapeHtml(e.nom)}</div>
                  <div class="equip-meta">
                    ${e.entrenadors && e.entrenadors !== '—' ? `<span>🧑‍🏫 ${escapeHtml(e.entrenadors)} ·</span>` : ''}
                    ${e.sessions.map(s => `<span class="session">${DIES_SHORT[s.dia]} ${s.ini}</span>`).join('')}
                    ${e.jugadors && e.jugadors.length > 0 ? `<span>· ${e.jugadors.length} jugadors</span>` : ''}
                  </div>
                </div>
                <span class="equip-chev">›</span>
              </button>
            `).join('')}
          </div>`;
        }
      }

      bodyHTML = `
        <input class="search-input" id="search" placeholder="🔍 Busca equip, entrenador/a o jugador/a..." value="${escapeHtml(state.busqueda)}">
        ${tabsHTML}
        ${listHTML}`;
    }

    document.getElementById('app').innerHTML = `${headerHTML}<div class="container">${bodyHTML}</div>`;

    // Eventos
    const search = document.getElementById('search');
    if (search) {
      search.addEventListener('input', ev => {
        state.busqueda = ev.target.value;
        state.seleccionat = null;
        render();
        const s2 = document.getElementById('search');
        if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
      });
    }

    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.tab = btn.dataset.tab;
        state.seleccionat = null;
        render();
      });
    });

    document.querySelectorAll('[data-equip]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.seleccionat = btn.dataset.equip;
        state.downloaded = false;
        render();
      });
    });

    const back = document.querySelector('[data-back]');
    if (back) {
      back.addEventListener('click', () => {
        state.seleccionat = null;
        render();
      });
    }

    const dl = document.querySelector('[data-download]');
    if (dl) {
      dl.addEventListener('click', () => {
        const equip = allEquips.find(e => e.nom === dl.dataset.download);
        if (equip) {
          downloadICS(equip);
          state.downloaded = true;
          render();
          setTimeout(() => { state.downloaded = false; render(); }, 2500);
        }
      });
    }
  }

  render();
})();
</script>
</body>
</html>
