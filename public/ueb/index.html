<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">

<title>UE Barberà · Horaris Posttemporada 25-26</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; color: #e2e8f0; -webkit-tap-highlight-color: transparent; }
  .header { background: linear-gradient(90deg, #1d4ed8, #0ea5e9); padding: 16px 20px; display: flex; align-items: center; gap: 12px; box-shadow: 0 4px 24px rgba(14,165,233,.35); flex-wrap: wrap; row-gap: 8px; }
  .header-icon { font-size: 28px; }
  .header-title { font-size: 18px; font-weight: 900; color: #fff; letter-spacing: .03em; }
  .header-sub { font-size: 11px; color: #bae6fd; letter-spacing: .1em; text-transform: uppercase; }
  .header-warn { background: rgba(255,255,255,.15); border-radius: 8px; padding: 5px 10px; font-size: 11px; color: #fef9c3; font-weight: 700; }
  .container { padding: 16px; max-width: 720px; margin: 0 auto; }
  .stats-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .stat-pill { flex: 1; min-width: 80px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 8px 12px; text-align: center; }
  .stat-num { font-size: 22px; font-weight: 900; color: #0ea5e9; line-height: 1; }
  .stat-lbl { font-size: 10px; color: #64748b; text-transform: uppercase; margin-top: 4px; letter-spacing: .05em; }
  .avui-banner { background: linear-gradient(90deg, #047857, #0ea5e9); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .avui-title { font-size: 11px; color: rgba(255,255,255,.85); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
  .avui-list { color: #fff; font-size: 13px; line-height: 1.5; }
  .avui-empty { color: rgba(255,255,255,.7); font-size: 12px; font-style: italic; }
  .search-input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1.5px solid #334155; background: #1e293b; color: #e2e8f0; font-size: 14px; margin-bottom: 14px; outline: none; }
  .search-input:focus { border-color: #0ea5e9; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 16px; }
  .tab-btn { padding: 10px 4px; border-radius: 10px; border: none; background: #1e293b; color: #94a3b8; font-weight: 700; font-size: 12px; cursor: pointer; font-family: inherit; }
  .tab-btn.active.masc { background: #1d4ed8; color: #fff; }
  .tab-btn.active.fem { background: #db2777; color: #fff; }
  .tab-btn.active.cal { background: #7c3aed; color: #fff; }
  .tab-btn.active.info { background: #047857; color: #fff; }
  .equips-list { display: flex; flex-direction: column; gap: 8px; }
  .equip-card { background: #1e293b; border: 1.5px solid #334155; border-radius: 12px; padding: 13px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; color: #e2e8f0; transition: border-color .15s, transform .1s; width: 100%; font-family: inherit; }
  .equip-card:hover { border-color: var(--accent, #1d4ed8); }
  .equip-card:active { transform: scale(.99); }
  .equip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--accent, #1d4ed8); }
  .equip-info { flex: 1; min-width: 0; }
  .equip-name { font-weight: 700; font-size: 14px; }
  .equip-meta { font-size: 11px; color: #64748b; margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .equip-meta .session-mini { color: #94a3b8; background: rgba(148,163,184,.1); border-radius: 4px; padding: 1px 5px; font-weight: 600; }
  .equip-meta .next-mini { background: #047857; color: #fff; border-radius: 4px; padding: 1px 6px; font-weight: 700; font-size: 10px; }
  .equip-chev { color: #475569; font-size: 16px; }
  .empty { color: #64748b; text-align: center; padding: 32px; }
  .back-btn { background: transparent; border: none; color: #0ea5e9; font-size: 14px; cursor: pointer; margin-bottom: 12px; padding: 0; font-weight: 700; font-family: inherit; }
  .detall-card { background: #1e293b; border-radius: 16px; overflow: hidden; border: 1.5px solid #334155; }
  .detall-header { padding: 16px 20px; background: linear-gradient(90deg, var(--accent, #1d4ed8), color-mix(in srgb, var(--accent, #1d4ed8) 75%, transparent)); }
  .detall-name { font-size: 22px; font-weight: 900; line-height: 1.2; }
  .detall-entr { font-size: 12px; opacity: .9; margin-top: 4px; }
  .detall-body { padding: 16px 20px; }
  .nota { background: #422006; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #fde68a; margin-bottom: 14px; }
  .section-label { font-size: 11px; color: #64748b; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; margin-top: 14px; }
  .section-label:first-child { margin-top: 0; }
  .sessions-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .session-row { background: #0f172a; border-radius: 8px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; }
  .session-day { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 8px; color: #fff; border-radius: 6px; font-size: 12px; font-weight: 800; }
  .session-day.Dilluns { background: #1d4ed8; }
  .session-day.Dimarts { background: #0369a1; }
  .session-day.Dimecres { background: #0f766e; }
  .session-day.Dijous { background: #7c3aed; }
  .session-day.Divendres { background: #b45309; }
  .session-time { flex: 1; font-size: 13px; font-weight: 600; color: #e2e8f0; }
  .session-pista { font-size: 11px; color: #94a3b8; background: rgba(148,163,184,.12); padding: 3px 7px; border-radius: 4px; font-weight: 600; }
  .download-btn, .share-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; color: #fff; font-weight: 800; font-size: 14px; cursor: pointer; margin-bottom: 8px; transition: filter .2s; font-family: inherit; }
  .download-btn { background: var(--accent, #1d4ed8); }
  .download-btn.done { background: #047857; }
  .share-btn { background: #047857; }
  .download-btn:hover, .share-btn:hover { filter: brightness(1.1); }
  .download-hint { font-size: 11px; color: #475569; text-align: center; margin-top: 6px; margin-bottom: 16px; line-height: 1.4; }
  .jugadors-list { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
  @media (max-width: 480px) { .jugadors-list { grid-template-columns: 1fr; } }
  .jugador { font-size: 12px; color: #cbd5e1; padding: 5px 0; border-bottom: 1px solid #0f172a; break-inside: avoid; }
  .jugador-num { color: #475569; margin-right: 6px; font-size: 10px; }
  .jugador-year { color: #64748b; font-size: 10px; margin-left: 4px; }
  .jugador-note { color: #fde68a; font-size: 10px; margin-left: 6px; }
  .contactes { display: flex; flex-direction: column; gap: 8px; }
  .contacte { background: #1e293b; border-radius: 12px; border: 1px solid #334155; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .contacte-nom { font-weight: 700; font-size: 14px; }
  .contacte-rol { font-size: 11px; color: #64748b; margin-top: 2px; }
  .contacte-tel { color: #0ea5e9; font-weight: 800; font-size: 14px; text-decoration: none; white-space: nowrap; }
  .contacte-tel-empty { color: #475569; font-size: 12px; }
  /* Calendari setmanal */
  .cal-grid { display: grid; grid-template-columns: 60px 1fr 1fr 1fr 1fr 1fr; gap: 4px; font-size: 11px; }
  .cal-hdr { background: #334155; color: #e2e8f0; padding: 6px 4px; text-align: center; font-weight: 700; border-radius: 6px; }
  .cal-time { background: #0f172a; color: #64748b; padding: 4px; text-align: center; font-weight: 600; border-radius: 4px; font-size: 10px; }
  .cal-cell { min-height: 36px; padding: 2px; display: flex; flex-direction: column; gap: 2px; }
  .cal-evt { background: rgba(29,78,216,.18); color: #cbd5e1; border-radius: 4px; padding: 3px 5px; font-size: 9px; line-height: 1.15; cursor: pointer; border-left: 3px solid var(--accent, #1d4ed8); }
  .cal-evt.fem { border-left-color: #db2777; background: rgba(219,39,119,.13); }
  .cal-evt-name { font-weight: 700; }
  .cal-evt-time { color: #94a3b8; font-size: 8px; }
  .footer-meta { text-align: center; color: #475569; font-size: 10px; margin-top: 30px; padding: 14px; }
  .footer-meta a { color: #64748b; text-decoration: none; }
  mark { background: #fde68a; color: #0f172a; border-radius: 3px; padding: 0 2px; }
</style>

(function(){
  const DIA_NUM = { Dilluns: 1, Dimarts: 2, Dimecres: 3, Dijous: 4, Divendres: 5 };
  const DIES_SHORT = { Dilluns:'Dl', Dimarts:'Dm', Dimecres:'Dc', Dijous:'Dj', Divendres:'Dv' };
  const DIES = ['Dilluns', 'Dimarts', 'Dimecres', 'Dijous', 'Divendres'];

  const EQUIPS_MASC = DATA.EQUIPS_MASC;

  const allEquips = [...EQUIPS_MASC, ...EQUIPS_FEM];
  const isFem = e => EQUIPS_FEM.some(f => f.nom === e.nom);

  function accentColor(e) {
    if (!e) return '#1d4ed8';
    if (isFem(e)) return '#db2777';
    if (e.nom.includes('Sènior') || e.nom.includes('Veteran')) return '#64748b';
    return '#1d4ed8';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"\']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function highlight(text, q) {
    if (!q) return escapeHtml(text);
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return escapeHtml(text).replace(re, '<mark>$1</mark>');
  }

  function formatTel(tel) {
    return tel.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3');
  }

  // Avui (català: 1=Dl..7=Dg), JS getDay 0=Dg..6=Ds
  function todayCatNum() {
    const d = new Date().getDay();
    return d === 0 ? 7 : d;
  }

  function equipsAvui() {
    const td = todayCatNum();
    if (td > 5) return []; // Cap de setmana
    const dia = DIES[td - 1];
    const out = [];
    for (const e of allEquips) {
      const ses = e.sessions.filter(s => s.dia === dia);
      if (ses.length) out.push({ equip: e, sessions: ses });
    }
    return out.sort((a, b) => a.sessions[0].ini.localeCompare(b.sessions[0].ini));
  }

  function nextSessionFor(equip) {
    const now = new Date();
    const today = todayCatNum();
    // Próxima sesión: misma semana después de ahora, o próxima semana
    let best = null;
    let bestDiff = Infinity;
    for (const s of equip.sessions) {
      const diaNum = DIA_NUM[s.dia];
      let diffDays = (diaNum - today + 7) % 7;
      const [h, m] = s.ini.split(':').map(Number);
      let diffMs = diffDays * 86400000 + (h * 3600000 + m * 60000) - (now.getHours()*3600000 + now.getMinutes()*60000);
      if (diffDays === 0 && diffMs < 0) diffMs += 7 * 86400000;
      if (diffMs < bestDiff) { bestDiff = diffMs; best = s; }
    }
    return best;
  }

  // ICS
  function datesBetween(dowISO) {
    const dates = [];
    const start = new Date('2025-05-26');
    const end = new Date('2025-06-19');
    const d = new Date(start);
    const jsDow = dowISO === 7 ? 0 : dowISO;
    while (d.getDay() !== (jsDow % 7 === 0 ? 0 : jsDow)) d.setDate(d.getDate()+1);
    while (d <= end) { dates.push(new Date(d)); d.setDate(d.getDate()+7); }
    return dates;
  }
  function fmtDT(date, hhmm) {
    const [h,m] = hhmm.split(':').map(Number);
    const dt = new Date(date); dt.setHours(h, m, 0);
    const pad = n => String(n).padStart(2,'0');
    return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(h)}${pad(m)}00`;
  }
  function generarICS(equips) {
    const list = Array.isArray(equips) ? equips : [equips];
    const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UE Barberà//Horaris//CA','CALSCALE:GREGORIAN'];
    list.forEach(equip => {
      equip.sessions.forEach(ses => {
        const dowISO = DIA_NUM[ses.dia];
        datesBetween(dowISO).forEach(date => {
          const iso = date.toISOString().slice(0,10);
          if (iso === '2025-06-06') return;
          if (equip.nom === 'Cadete A' && date.getDay() === 5 && date >= new Date('2025-06-01')) return;
          const uid = `${equip.nom.replace(/\s/g,'')}${iso}${ses.ini.replace(':','')}-${Math.random().toString(36).slice(2,8)}@uebarb`;
          lines.push('BEGIN:VEVENT');
          lines.push(`DTSTART:${fmtDT(date, ses.ini)}`);
          lines.push(`DTEND:${fmtDT(date, ses.fi)}`);
          lines.push(`SUMMARY:🏀 ${equip.nom}${ses.pista ? ' ('+ses.pista+')' : ''}`);
          lines.push(`DESCRIPTION:Entrenament ${equip.nom}\\nEntrenador/a: ${equip.entrenadors||'—'}${ses.pista ? '\\nPista: '+ses.pista : ''}`);
          lines.push(`LOCATION:UE Barberà${ses.pista ? ' - '+ses.pista : ''}`);
          lines.push(`UID:${uid}`);
          lines.push('END:VEVENT');
        });
      });
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }
  function downloadICS(equip, filename) {
    const ics = generarICS(equip);
    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || `${equip.nom.replace(/\s+/g,'_')}_UE_Barbera.ics`;
    a.click();
    URL.revokeObjectURL(url);
  }

    if (equip.nota) lines.push(`\n⚠️ ${equip.nota}`);
    lines.push(`\n🔗 ${location.origin}${location.pathname}`);

                  <span class="jugador-num">${i+1}.</span>${escapeHtml(j.name)}
                  <span class="jugador-year">'${j.year.slice(2)}</span>
                  ${j.note ? `<span class="jugador-note">${escapeHtml(j.note)}</span>` : ''}
                </div>
              `).join('')}
            </div>
          ` : '<div style="font-size:12px;color:#475569;text-align:center;padding:8px">Llista de jugadors/es pendent</div>'}
        </div>
      </div>
    `;
  }

  function renderCalendari() {
    // Construir grid: filas = horas (17:00, 18:00, 19:00, 20:00, 21:00), columnas = días
    const horas = ['17:00', '18:00', '19:00', '20:00', '21:00'];
    // Plantar todos los eventos por día/hora
    const events = {};
    DIES.forEach(d => events[d] = []);
    allEquips.forEach(e => {
      e.sessions.forEach(s => {
        events[s.dia].push({ equip: e, ses: s });
      });
    });
    DIES.forEach(d => events[d].sort((a,b) => a.ses.ini.localeCompare(b.ses.ini)));

    let html = `<div class="cal-grid">
      <div class="cal-hdr">⏰</div>
      ${DIES.map(d => `<div class="cal-hdr">${DIES_SHORT[d]}</div>`).join('')}
    `;
    horas.forEach(h => {
      html += `<div class="cal-time">${h}</div>`;
      DIES.forEach(d => {
        const inHour = events[d].filter(({ses}) => {
          const startH = parseInt(ses.ini.split(':')[0]);
          const hH = parseInt(h.split(':')[0]);
          return startH === hH;
        });
        const cellHTML = inHour.map(({equip, ses}) => `
          <div class="cal-evt ${isFem(equip)?'fem':''}" style="--accent:${accentColor(equip)}" data-equip="${escapeHtml(equip.nom)}">
            <div class="cal-evt-name">${escapeHtml(equip.nom)}</div>
            <div class="cal-evt-time">${ses.ini}-${ses.fi}${ses.pista ? ' ·'+ses.pista : ''}</div>
          </div>
        `).join('');
        html += `<div class="cal-cell">${cellHTML}</div>`;
      });
    });
    html += '</div>';
    html += `<div class="download-hint" style="margin-top:14px">Toca un esdeveniment per veure el detall complet.</div>`;
    html += `<button class="share-btn" id="downloadAll" style="margin-top:10px">📅 Descarregar tots els entrenaments del club</button>`;
    return html;
  }

  function attachEvents() {
    const search = document.getElementById('search');
    if (search) {
      search.addEventListener('input', ev => {
        state.busqueda = ev.target.value;
        state.seleccionat = null;
        render();
        const s2 = document.getElementById('search');
        if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
      });
    }
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => { state.tab = btn.dataset.tab; state.seleccionat = null; render(); });
    });
    document.querySelectorAll('[data-equip]').forEach(btn => {
      btn.addEventListener('click', () => { state.seleccionat = btn.dataset.equip; state.downloaded = false; render(); window.scrollTo(0, 0); });
    });
    const back = document.querySelector('[data-back]');
    if (back) back.addEventListener('click', () => { state.seleccionat = null; render(); });
    const dl = document.querySelector('[data-download]');
    if (dl) dl.addEventListener('click', () => {
      const equip = allEquips.find(e => e.nom === dl.dataset.download);
      if (equip) { downloadICS(equip); state.downloaded = true; render(); setTimeout(() => { state.downloaded = false; render(); }, 2500); }
    });
    const sh = document.querySelector('[data-share]');
    if (sh) sh.addEventListener('click', () => {
      const equip = allEquips.find(e => e.nom === sh.dataset.share);
      if (equip) shareWhatsApp(equip);
    });
    const dla = document.getElementById('downloadAll');
    if (dla) dla.addEventListener('click', () => {
      downloadICS(allEquips, 'UE_Barbera_TOTS_els_equips.ics');
    });
  }

  render();

  // ─── ANALYTICS (counterapi.dev, 1 visita única por sesión) ──────────────
  (function track() {
    if (sessionStorage.getItem('uebVisitCounted')) return;
    sessionStorage.setItem('uebVisitCounted', '1');
    const WS = 'wts-ueb-2025-priv-x7k9q';
    const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    fetch(`https://api.counterapi.dev/v1/${WS}/total/up`).catch(() => {});
    fetch(`https://api.counterapi.dev/v1/${WS}/day_${today}/up`).catch(() => {});
  })();
})();
</script>
</body>
</html>
