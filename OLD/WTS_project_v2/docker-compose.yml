version: '3.8'

services:

  ### WordPress: semillasdeti.com ###
  wp_semillas:
    image: wordpress:6.8.1-php8.2-apache
    container_name: wp_semillas
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: semillas
      WORDPRESS_DB_USER: semillas
      WORDPRESS_DB_PASSWORD: Tr@munatana2025!
      VIRTUAL_HOST: semillasdeti.com,www.semillasdeti.com
      LETSENCRYPT_HOST: semillasdeti.com,www.semillasdeti.com
      LETSENCRYPT_EMAIL: admin@webtenseenergy.com
    volumes:
      - ./wordpress_semillas:/var/www/html
    expose:
      - "80"

  ### WordPress: webtenseenergy.com ###
  wp_webtense:
    image: wordpress:6.8.1-php8.2-apache
    container_name: wp_webtense
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: webtense
      WORDPRESS_DB_USER: webtense
      WORDPRESS_DB_PASSWORD: Tr@munatana2025!
      VIRTUAL_HOST: webtenseenergy.com,www.webtenseenergy.com
      LETSENCRYPT_HOST: webtenseenergy.com,www.webtenseenergy.com
      LETSENCRYPT_EMAIL: admin@webtenseenergy.com
    volumes:
      - ./wordpress_webtense:/var/www/html
    expose:
      - "80"

  ### Base de datos compartida ###
  db:
    image: mariadb:10.6
    container_name: wp_db
    environment:
      MYSQL_ROOT_PASSWORD: Tr@munatana2025!
    volumes:
      - db_data:/var/lib/mysql

  ### phpMyAdmin (compartido para ambos dominios) ###
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: wp_phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: Tr@munatana2025!
      VIRTUAL_HOST: phpmyadmin.semillasdeti.com,phpmyadmin.webtenseenergy.com
      LETSENCRYPT_HOST: phpmyadmin.semillasdeti.com,phpmyadmin.webtenseenergy.com
      LETSENCRYPT_EMAIL: admin@webtenseenergy.com
    expose:
      - "80"

  ### Odoo 16 (subdominio odoo.webtenseenergy.com) ###
  odoo:
    image: odoo:16.0
    container_name: odoo16
    depends_on:
      - postgres
    environment:
      HOST: postgres
      USER: odoo
      PASSWORD: Tr@munatana2025!
      VIRTUAL_HOST: odoo.webtenseenergy.com
      LETSENCRYPT_HOST: odoo.webtenseenergy.com
      LETSENCRYPT_EMAIL: admin@webtenseenergy.com
    volumes:
      - odoo_data:/var/lib/odoo
      - ./odoo_addons:/mnt/extra-addons
    expose:
      - "8069"

  postgres:
    image: postgres:15
    container_name: odoo_pg
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: Tr@munatana2025!
    volumes:
      - odoo_db:/var/lib/postgresql/data

  ### NGINX + Let's Encrypt Proxy (HTTPS automático) ###
  nginx-proxy:
    image: nginxproxy/nginx-proxy:latest
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html

  letsencrypt:
    image: nginxproxy/acme-companion
    container_name: nginx-letsencrypt
    depends_on:
      - nginx-proxy
    environment:
      DEFAULT_EMAIL: admin@webtenseenergy.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme:/etc/acme.sh

volumes:
  db_data:
  odoo_data:
  odoo_db:
  nginx_certs:
  nginx_vhost:
  nginx_html:
  acme:
